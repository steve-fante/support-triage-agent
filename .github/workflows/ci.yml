name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Linter
        run: ruff check .

      - name: Tests
        run: pytest -q --cov=support_triage --cov-report=term-missing

      - name: Évaluation de la ligne de base
        run: python evals/run_eval.py --regles
