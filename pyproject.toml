[project]
name = "support-triage-agent"
version = "0.1.0"
description = "Triage automatisé des demandes de support d'un ERP Odoo : qualification typée, routage et escalade humaine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Steve Christian FANTE" }]
keywords = ["odoo", "erp", "support", "triage", "llm", "langchain", "structured-output", "classification"]

dependencies = [
    "pydantic>=2.6",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=0.3", "langchain-core>=0.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
support-triage = "support_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"evals/*" = ["E402"]
